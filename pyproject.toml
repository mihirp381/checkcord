[project]
name = "checkcord"
version = "0.1.0"
description = "Self-hosted engineering context for coding agents: decisions from chat, tickets and reviews, served over MCP with per-person access control"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mcp", "coding-agents", "engineering-context", "access-control", "self-hosted", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Private :: Do Not Upload",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "structlog>=24.1.0",
    "uvloop>=0.19.0",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "slack-bolt>=1.28.0",
    "slack-sdk>=3.42.0",
    "aiohttp>=3.14.1",
    "apscheduler>=3.10.4",
    "langchain-core>=1.4.8",
    "langchain-openai>=0.1.0",
    "openai>=2.0.0",
    "langchain-voyageai>=0.1.7",
    "voyageai>=0.5.0",
    "pgvector>=0.4.2",
    "jinja2>=3.1.6",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "trustme>=1.2.1",
    "watchdog>=4.0.0",
    "aiosqlite>=0.20.0",
    "mcp>=1.28.1",
    "httpx>=0.28.1",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.10.0",
    "prometheus-client>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/mihirp381/checkcord"
Documentation = "https://github.com/mihirp381/checkcord/tree/main/docs"
Changelog = "https://github.com/mihirp381/checkcord/blob/main/CHANGELOG.md"
Issues = "https://github.com/mihirp381/checkcord/issues"

[project.scripts]
checkcord = "checkcord.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "checkcord"
namespace = true

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "fakeredis>=2.36.2",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "ASYNC", # flake8-async
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "ASYNC"]
"tests/*" = ["ASYNC221", "ASYNC230"]
"sim/*" = ["ASYNC109"]

[tool.mypy]
mypy_path = "src"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["type-arg", "arg-type", "attr-defined", "assignment", "no-untyped-call", "import-untyped", "union-attr", "unused-ignore", "redundant-cast"]
disallow_untyped_decorators = false
disallow_subclassing_any = false
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin"
]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "tests"
]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src", "."]
timeout = 120
markers = [
    "integration: needs a live Postgres and/or Redis (docker compose up -d --wait postgres redis && alembic upgrade head).",
    "live(*env_keys): needs a real LLM/embedding API key or outbound network; skipped unless every named env var is set.",
    "real_bot_auth: run Teams activity tests with the real Bot Framework token check.",
]
